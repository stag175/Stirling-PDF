[project]
name = "engine"
version = "0.1.0"
description = "AI Document Engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0.0",
    "pydantic-ai>=1.67.0",
    "pydantic-ai-slim[voyageai]>=1.67.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.1",
    "sqlite-vec>=0.1.6",
    "uvicorn>=0.35.0",
    "opentelemetry-sdk>=1.39.0",
    "posthog>=3.0.0",
]

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "datamodel-code-generator[ruff]>=0.26.0",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "pyright>=1.1.408",
    "referencing>=0.35.0",
    "ruff>=0.14.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = [
    "tests",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "RUF100",
    "UP",
    "PYI",    # flake8-pyi: flags deprecated typing constructs
    "FA",     # flake8-future-annotations: flags missing future annotations imports
    "BLE",    # flake8-blind-except: flags bare `except Exception`
]

[tool.pyright]
pythonVersion = "3.13"

reportImportCycles = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "warning"
reportUnknownParameterType = "warning"
reportDeprecated = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests`` is on the path so test modules can import shared helpers (e.g.
# ``from conftest import build_app_settings``) without packaging the tests dir.
pythonpath = ["src", "tests"]
# Use importlib import mode so test directories don't need __init__.py files
# and duplicate basenames (e.g. multiple test_routes.py) collect cleanly.
addopts = "--import-mode=importlib"

# ---------------------------------------------------------------------------
# Coverage (I1 — engine coverage visibility + regression gate).
#
# Unlike the historically-decorative JVM/frontend gates, the engine already has
# real coverage (264 tests: ~83% statement / ~78% statement+branch at the time
# this gate was added). These settings make that number VISIBLE on every run and
# enforce a floor so new untested code can't silently erode it. The cov flags
# live in the ``engine:test`` task (not in ``addopts``) so an ad-hoc ``pytest -k
# one_test`` during development isn't failed by ``fail_under``.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# Floor sits a few points below the measured baseline so the gate catches genuine
# regressions without flaking on rounding. Ratchet upward as coverage improves
# (75 at the I1/Wave 25 baseline of 78.3%; raised to 79 after the G3 tracking.py
# kill-switch tests lifted the total to 81.1% — Wave 27).
fail_under = 79
# Conventional non-testable lines, added to coverage.py's defaults (which already
# cover ``# pragma: no cover``). These never represent reachable runtime logic.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
