name: Release Artifact Provenance (E3)

# Roadmap E3 — SLSA build-provenance attestations for release artifacts.
#
# Generates Sigstore-signed build-provenance attestations for the assets attached to a GitHub
# Release, so downstream consumers can verify artifact origin with `gh attestation verify <file>
# --repo <owner>/<repo>`. Runs on release publish (and manual dispatch for a specific tag).
#
# This is an ADDITIVE, standalone workflow: it does not touch the existing build/release pipelines,
# so it cannot break them. It is a DRAFT authored without a CI runner to validate against — review
# before relying on it. For full SLSA provenance (proving the *build* produced the bytes), move the
# `attest-build-provenance` step into the artifact-build jobs (multiOSReleases.yml / backend-build.yml)
# with the same permissions; this after-the-fact variant attests the published release digests.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attest (e.g. v2.11.0)"
        required: true

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read # download release assets
      id-token: write # Sigstore OIDC signing
      attestations: write # write the attestation to the repo
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: echo "tag=${EVENT_TAG:-$INPUT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --skip-existing
          echo "Downloaded assets:"
          ls -la release-assets

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: "release-assets/*"
